<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · WiyaMusic</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050B1B" />
    <link rel="icon" type="image/png" href="assets/icons/wiyamusic_icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        text-align: center;
      }

      .error-card {
        width: min(100%, 520px);
        padding: 2rem;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #2a3b58;
        box-shadow: 0 8px 24px rgba(56, 178, 246, 0.2);
      }

      .error-card img {
        width: 88px;
        margin: 0 auto 1.25rem;
        border-radius: 24px;
      }

      .error-card h1 {
        margin: 0 0 0.75rem;
        font-family: "Paytone One", Inter, sans-serif;
        font-weight: 400;
      }

      .error-card p {
        color: #a8b8d8;
        margin: 0 0 1.5rem;
      }
    </style>
  </head>
  <body>
    <main class="error-page">
      <div class="error-card">
        <img
          src="assets/icons/wiyamusic_icon.png"
          alt=""
          width="88"
          height="88"
        />
        <h1>Page not found</h1>
        <p>That page does not exist on the WiyaMusic website.</p>
        <a class="button" href="./">Back to home</a>
      </div>
    </main>
  </body>
</html>
