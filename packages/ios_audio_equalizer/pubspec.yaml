name: ios_audio_equalizer
description: Multi-band equalizer for just_audio on iOS via AVPlayerItem audio mix taps.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IosAudioEqualizerPlugin
